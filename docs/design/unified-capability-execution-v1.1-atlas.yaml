  assessment:
    navn: Kumulative grenser
    klasse: 'Kjerne: budsjett'
    formaal: Stopper en serie handlinger som hver for seg er lov, men sammen overskrider et
      budsjett.
    gjor: >-
      Signerte sum-, count- og change-grenser per principal eller ressurs; reserve → begin
      → settle før dispatch; idempotensnøkkel per verktøy.
    naa: >-
      Opt-in, SQLite på én host, ingen Postgres. Ved source_revision seks pilotblokkere; P0 1–3
      er lukket i denne PR-en: reviewerens bevis kontrolleres av et deployment-eid
      evidensmodul før noe frigis (uten modul holdes alt), ToolDidNotExecute frigir kun fra en
      kilde den signerte policyen navngir, REMORA_REQUIRE_IDEMPOTENCY krever
      idempotensnøkkel per metret skriveverktøy, og controlled_pilot krever signerte
      obligatoriske limits. Gjenstår: lokal ledger (P0 8) og kjede-append utenfor
      ledger-transaksjonen (P0 4).
    nodvendighet: Kritisk
    nodvendighet_begrunnelse: For en betalingslignende pilot er dette hovedkontrollen.
    sdd_hook: PRE_DISPATCH / EXECUTION / EFFECT
    sdd_modus: ENFORCE obligatorisk i avgrenset skrivepilot
    sdd_endring: >-
      Postgres-LimitLedger og resolusjon med kjede-append i én transaksjon. Levert: SDK
      list_unresolved og resolve_unknown, evidenskontroll, navngitte non_execution-kilder,
      nøkkelkrav og profilbinding (P0 1–3).
    oppnaelig_niva: ENFORCED_PRODUCTION
    oppnaelig_niva_tekst: ENFORCED_PRODUCTION i én pilot etter delt ledger og lukkede §97-punkter.
    risiko:
      sannsynlighet: H
      konsekvens: H
      tekst: >-
        Dobbel belastning, budsjett frigjort for en handling som faktisk skjedde, overskridelse
        på tvers av hosts.
    reversering:
      grad: Vanskelig
      tekst: >-
        Historikken slettes ikke. En reservasjon kan frigjøres gjennom en dokumentert avklaring
        når det er etablert at effekten ikke skjedde; en tilbakerulling av konfigurasjon frigjør
        aldri budsjett.
    sikkerhet: Signert policy, idempotensnøkkel, reviewer ≠ betaler, UNKNOWN holder budsjettet
      til avklaring.
    litteratur:
    - kilde: Prior art for kumulative grenser
      referanse: >-
        provenance/verified-prior-art-cumulative-limits-2026-10-23.md: Schneider 2000, edit
        automata 2005, UCON_ABC 2004, escrow 1986, leases 1989, Simplex, shielding 2018
      rolle: PRIOR_ART_OVERLAP
    - kilde: NEGATIVE_RESULTS §97
      referanse: tre åpne punkter
      rolle: record
    forutsetter:
    - CAP-013
    - CAP-005
    - CAP-007
    - CAP-017
