repair_order:
- nr: 1
  arbeid: >-
    Stopp ubekreftet frigivelse av budsjett. Håndter både ToolDidNotExecute og reviewerens
    executed=false.
  akseptanse: Uten kontrollerbar dokumentasjon beholdes reservasjonen som ukjent.
  kapabiliteter:
  - CAP-031
- nr: 2
  arbeid: Krev stabil operasjonsnøkkel for relevante skriveverktøy.
  akseptanse: Samme forretningsoperasjon gjennom nye forslag utføres ikke på nytt.
  kapabiliteter:
  - CAP-031
- nr: 3
  arbeid: Gjør signerte limits og nødvendig dekning obligatorisk i skrivepilotprofilen.
  akseptanse: Manglende nøkkel, signatur eller meter gir oppstartsnekt eller avslag.
  kapabiliteter:
  - CAP-031
  - CAP-017
- nr: 4
  arbeid: Gjør limits-avklaring og audit transaksjonelt konsistente.
  akseptanse: Krasj mellom ledger-endring og kjedepost gir ingen permanent udokumentert budsjettfrigivelse.
  kapabiliteter:
  - CAP-031
  - CAP-005
- nr: 5
  arbeid: Etterprøv §98-reparasjonen og atomisk admission.
  akseptanse: Avvist review lekker ingen brukbar grant, også når ugyldiggjøring eller lagring
    feiler.
  kapabiliteter:
  - CAP-007
  - CAP-003
- nr: 6
  arbeid: Fullfør flow-binding, flow-race og friskhetskontrakt (IFC-06 pågår; IFC-11 og IFC-12
    ikke startet).
  akseptanse: >-
    Kontrollerte argumenter samsvarer med faktisk input; endret autoritet eller flow stopper
    handlingen innen erklært kontrakt.
  kapabiliteter:
  - CAP-030
  - CAP-020
- nr: 7
  arbeid: Verifiser credential-topologi og stoppmekanisme.
  akseptanse: Agent og tool worker kan ikke omgå executor; verify-only kan ikke signere.
  kapabiliteter:
  - CAP-024
  - CAP-017
  - CAP-003
  - CAP-013
- nr: 8
  arbeid: Bygg delt LimitLedger før flerhost-aktivering.
  akseptanse: To executorer deler budsjett og operasjonsnøkler uten dobbeltforbruk.
  kapabiliteter:
  - CAP-031
capabilities:
- id: CAP-001
  register_at_source:
    name: Decision engine (hard guards -> conditional gates -> trust routing)
    status: WIRED_API_PATH
    code:
    - remora/policy/decision_engine.py
    - servers/api.py
    tests:
    - tests/test_rem017_policy_mutations.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - SHADOW_PILOT≥WIRED_API_PATH
    - PRODUCTION≥EXTERNALLY_VERIFIED
  assessment:
    navn: Beslutningsmotor
    klasse: 'Kjerne: autoritet'
    formaal: 'Gir én deterministisk beslutning per forslag: ACCEPT, VERIFY, ABSTAIN eller
      ESCALATE.'
    gjor: >-
      Harde vakter kjører først, deretter betingede porter og til slutt tillitsruting. Ingen
      modell eller monitor kan overstyre en hard vakt.
    naa: >-
      Koblet via /v1/assess (kun beslutning) og /v1/execution/* (full tilstandsmaskin med
      håndhevelse). Beslutningssporet med regel-IDer eksponeres ikke som eget API.
    nodvendighet: Kritisk
    nodvendighet_begrunnelse: >-
      All autoritet starter her. SHADOW_PILOT krever WIRED_API_PATH, og PRODUCTION krever
      EXTERNALLY_VERIFIED.
    sdd_hook: POLICY
    sdd_modus: ENFORCE
    sdd_endring: >-
      Beslutningsspor og regel-IDer gjennom foreslått capability-trace; decision_trace i SDK-ens
      AssessmentResult.
    oppnaelig_niva: ENFORCED_PRODUCTION
    oppnaelig_niva_tekst: >-
      ENFORCED_PRODUCTION innenfor én pilotkonfigurasjon. EXTERNALLY_VERIFIED krever REM-021
      og ligger utenfor SDD-en.
    risiko:
      sannsynlighet: L
      konsekvens: H
      tekst: >-
        En feil regel gir feil ACCEPT for en hel verktøyklasse. Mutasjonstester (REM-017)
        og invariantkontrollen (CAP-015) gjør dette mindre sannsynlig.
    reversering:
      grad: Middels
      tekst: >-
        Policyversjonen pinnes og signeres; tilbakerulling skjer til forrige signerte policy,
        ikke ved kodeendring i drift.
    sikkerhet: >-
      Deterministiske vakter dominerer, invariantsjekk feiler lukket til ESCALATE, og mutasjonstester
      dreper hver vakt som fjernes.
    litteratur:
    - kilde: RES-005 Verktøysikkerhet og agent-guardrails
      referanse: idéfamilie, ingen enkeltkilde
      rolle: implemented_and_tested
    - kilde: RES-023 Semantisk autoritet for verktøyruting
      referanse: intern design (SAP v5/v6)
      rolle: implemented_and_tested
    - kilde: SHELF-002 Sample, Predict, then Proceed
      referanse: arXiv 2506.02918
      rolle: ADOPTED
    - kilde: AgentSpec
      referanse: arXiv 2503.18666
      rolle: positioning_only
    forutsetter:
    - CAP-004
- id: CAP-002
  register_at_source:
    name: OPA/Rego delegation with full input parity and monotone floors
    status: WIRED_REFERENCE_PATH
    code:
    - remora/policy/opa_adapter.py
    - scripts/opa_conformance.py
    tests:
    - tests/test_opa_parity.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements: []
  assessment:
    navn: OPA/Rego-delegering
    klasse: Policy-interop
    formaal: Lar en kunde uttrykke policy i OPA/Rego uten å svekke REMORAs eget gulv.
    gjor: >-
      Sender full input til OPA med paritet mot Python-gulvet. Svaret kan bare gjøre beslutningen
      strengere (monotont gulv).
    naa: >-
      CI-portet konformitet; ikke eksponert gjennom REST-API-et. Ingen PolicyProvider-registry
      finnes; nærmeste søm er DecisionProvider.
    nodvendighet: Valgfri
    nodvendighet_begrunnelse: Nyttig for kunder som allerede bruker OPA, men ingen pilotprofil
      krever den.
    sdd_hook: POLICY
    sdd_modus: SHADOW → betinget ENFORCE
    sdd_endring: Server-side plugin via DecisionProvider, signert og pinnet bundle, paritetsattest.
    oppnaelig_niva: WIRED_API_PATH
    oppnaelig_niva_tekst: WIRED_API_PATH i SHADOW; ENFORCE først etter paritetsbevis på frosne
      og adversarielle tilfeller.
    risiko:
      sannsynlighet: M
      konsekvens: M
      tekst: >-
        Paritetsavvik mellom Rego og Python gir ulik beslutning. Det monotone gulvet begrenser
        feilen til for strenge beslutninger.
    reversering:
      grad: Lett
      tekst: Slås av ved å fjerne bundlen; Python-gulvet står alene som før.
    sikkerhet: Rego kan aldri senke gulvet; tidsavbrudd eller feil i OPA gir avslag, ikke
      ACCEPT.
    litteratur:
    - kilde: PDP/PEP-mønsteret (XACML, OPA)
      referanse: 'PROV-05: kjent mønster'
      rolle: positioning_only
    forutsetter:
    - CAP-001
- id: CAP-003
  register_at_source:
    name: Signed PDP->PEP token (mandatory expiry, jti one-time consumption, audience, max
      age)
    status: WIRED_API_PATH
    code:
    - remora/enforcement/gate.py
    - remora/enforcement/token.py
    - servers/execution_api.py
    tests:
    - tests/test_enforcement_ledgers_postgres.py
    - tests/test_token_hardening.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_API_PATH
    - LIMITED_ENFORCEMENT≥ENFORCED_PRODUCTION
  assessment:
    navn: Signert PDP→PEP-token
    klasse: 'Kjerne: autoritet'
    formaal: >-
      Fører en beslutning fra PDP til håndhevelsespunktet som en engangs, utløpende og mottakerbundet
      autorisasjon.
    gjor: Token med påkrevd utløp, audience og maksalder; jti forbrukes én gang.
    naa: >-
      Grant-format v3 er Ed25519; en prosess med bare REMORA_PDP_VERIFY_KEYS_ED25519 kan innløse
      grants, men ikke utstede dem. HMAC (v1/v2) er eldre migreringsmodus og avvises når Ed25519
      er konfigurert, med mindre REMORA_PDP_ACCEPT_HMAC er eksplisitt aktivert (1, true, yes
      eller on). Registerets forbehold beskriver fortsatt HMAC og henger etter koden. jti
      lagres varig (pep_consumed) bare med REMORA_PG_DSN eller REMORA_CHAIN_DB, ellers i prosess.
      Registerets forbehold sier at ingen test starter en ny tolk; en relevant prosessrestart-test
      er heller ikke identifisert i denne gjennomgangen.
    nodvendighet: Kritisk
    nodvendighet_begrunnelse: CONTROLLED_PILOT krever WIRED_API_PATH; LIMITED_ENFORCEMENT
      krever ENFORCED_PRODUCTION.
    sdd_hook: PRE_DISPATCH
    sdd_modus: ENFORCE
    sdd_endring: >-
      Grant-/jti-status i resultatet, SDK-typer SingleUseGrant/GrantStatus; delt backend obligatorisk;
      ingen klient-mint.
    oppnaelig_niva: ENFORCED_PRODUCTION
    oppnaelig_niva_tekst: >-
      ENFORCED_PRODUCTION i pilot, forutsatt delt ledger og v3 med verify-only-prosess i utførelsesdomenet.
    risiko:
      sannsynlighet: M
      konsekvens: H
      tekst: >-
        Gjenbruk av et token gir dobbel utførelse. Kjører utsteder og innløser i samme prosess
        med privat nøkkel, er splitten bare ett domene. NEGATIVE_RESULTS §98 viste at et usatt
        grant kunne returneres på review-stien; reparert, men åpent til uavhengig kjøring.
    reversering:
      grad: Vanskelig
      tekst: Brukte tokens må forbli brukt. En tilbakerulling sletter aldri pep_consumed-rader.
    sikkerhet: >-
      Ed25519 v3 med verify-only innløser, HMAC-nedgradering avvist, engangs-jti i varig ledger,
      utløp, audience og maksalder; grant holdes tilbake når admission nekter (§98-reparasjonen).
    litteratur:
    - kilde: Signerte autorisasjonstokens, XACML PDP/PEP
      referanse: PROV-05
      rolle: positioning_only
    - kilde: Engangs-nonce og replay-ledgere
      referanse: 'PROV-14: klassisk'
      rolle: positioning_only
    forutsetter:
    - CAP-017
    - CAP-005
- id: CAP-004
  register_at_source:
    name: Tool-call payload binding (canonical hash, recomputed before execution)
    status: WIRED_API_PATH
    code:
    - remora/policy/observation.py
    - servers/execution_api.py
    tests:
    - tests/test_execution_api.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_API_PATH
    - LIMITED_ENFORCEMENT≥ENFORCED_PRODUCTION
  assessment:
    navn: Payload-binding
    klasse: 'Kjerne: autoritet'
    formaal: Sikrer at autorisasjonen gjelder nøyaktig ett kall med nøyaktig disse argumentene.
    gjor: >-
      Kanonisk hash av verktøynavn og alle argumenter, beregnet på nytt rett før utførelse.
      ExecutionLease binder 16 felt.
    naa: >-
      /v1/execution/assess hasher fulle argumenter; legacy /v1/assess beholder sammendragsbinding.
      SDK-ens ToolCall mangler tenant, principal og digester.
    nodvendighet: Kritisk
    nodvendighet_begrunnelse: CONTROLLED_PILOT krever WIRED_API_PATH; LIMITED_ENFORCEMENT
      krever ENFORCED_PRODUCTION.
    sdd_hook: PRE_DISPATCH
    sdd_modus: ENFORCE
    sdd_endring: >-
      Lease-bundet identitet eksponert i attestasjon og SDK; differensialtester av kanonisering
      Python/TypeScript.
    oppnaelig_niva: ENFORCED_PRODUCTION
    oppnaelig_niva_tekst: ENFORCED_PRODUCTION i pilot.
    risiko:
      sannsynlighet: L
      konsekvens: H
      tekst: >-
        Avvik i kanonisering (Unicode, duplikatnøkler, tall) mellom to parsere kan la et byttet
        argument passere.
    reversering:
      grad: Vanskelig
      tekst: Skal aldri slås av i en pilot; en endring i kanonisering er en ny kontraktsversjon.
    sikkerhet: Gjenberegning ved dispatch, 16-felts lease, differensialtester på tvers av
      språk.
    litteratur:
    - kilde: Eksakt kallbinding
      referanse: PROV-03; AEGIS arXiv 2603.12621 (crosswalk)
      rolle: positioning_only
    - kilde: Kanonisk JSON
      referanse: RFC 8785; PROV-13
      rolle: positioning_only
    - kilde: Proof-Carrying Agent Actions
      referanse: arXiv 2606.04104
      rolle: positioning_only
    forutsetter: []
- id: CAP-005
  register_at_source:
    name: Audit chain (hash-chained decision history)
    status: PERSISTED_ATOMIC
    code:
    - remora/governance/tenant_chain.py
    - servers/execution_api.py
    tests:
    - tests/test_execution_api.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - SHADOW_PILOT≥PERSISTED_ATOMIC
    - PRODUCTION≥ENFORCED_PRODUCTION
  assessment:
    navn: Revisjonskjede
    klasse: Bevis og revisjon
    formaal: Gir en manipuleringsevident, hash-kjedet beslutningshistorikk per tenant.
    gjor: >-
      Hver hendelse kjedes til forrige; verifisering finnes som /v1/audit/chain/verify og
      /v1/execution/audit/verify.
    naa: >-
      PERSISTED_ATOMIC med REMORA_CHAIN_DB (SQLite) eller REMORA_PG_DSN (Postgres FOR UPDATE);
      standard er i prosess. Aktivering i en deployment er ikke påstått.
    nodvendighet: Kritisk
    nodvendighet_begrunnelse: SHADOW_PILOT krever PERSISTED_ATOMIC; PRODUCTION krever ENFORCED_PRODUCTION
      og REM-025.
    sdd_hook: AUDIT
    sdd_modus: ENFORCE + EVIDENCE_ONLY
    sdd_endring: Tenant- og sjekkpunktkobling; tester med to skrivere, krasj under append,
      fork og rekkefølge.
    oppnaelig_niva: ENFORCED_PRODUCTION
    oppnaelig_niva_tekst: ENFORCED_PRODUCTION med Postgres i pilot; ekstern forankring (REM-025)
      er egen jobb.
    risiko:
      sannsynlighet: M
      konsekvens: M
      tekst: >-
        Kjeden beviser ikke fullstendighet: en operatør kan undertrykke en hendelse før append.
        Uten DSN går historikken tapt ved omstart.
    reversering:
      grad: Vanskelig
      tekst: Data er append-only og skal ikke reverseres. Konfigurasjonen kan endres, men
        gamle poster beholdes.
    sikkerhet: FOR UPDATE i Postgres, signerte poster (CAP-017), verifiseringsendepunkter.
    litteratur:
    - kilde: Tamper-evident logging
      referanse: Crosby & Wallach 2009; RFC 6962 (PROV-01)
      rolle: positioning_only
    - kilde: 'SHELF-026 AIREP: per-decision evidence'
      referanse: arXiv 2608.21363
      rolle: PARTIAL
    - kilde: Auditable Agents
      referanse: arXiv 2604.05485 (ikke i repo)
      rolle: absent
    forutsetter:
    - CAP-017
- id: CAP-006
  register_at_source:
    name: A2A delegation envelope (principal-bound keys, attenuation, replay, payload binding)
    status: WIRED_REFERENCE_PATH
    code:
    - remora/governance/a2a_envelope.py
    - scripts/demo_industrial_maintenance.py
    tests:
    - tests/test_a2a_envelope.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements: []
  assessment:
    navn: A2A-delegering
    klasse: 'Interop: autoritet'
    formaal: Lar én agent delegere en innsnevret del av sin autoritet til en annen.
    gjor: Konvolutt med principal-bundne nøkler, attenuasjon, replay-vern og payload-binding.
    naa: Symmetrisk HMAC-referanse; produksjon krever JWS/COSE og tillitsankre.
    nodvendighet: Valgfri
    nodvendighet_begrunnelse: Første pilot trenger den ikke; ADR-UE-06 foreslår SHADOW til
      en asymmetrisk modell er akseptert.
    sdd_hook: AUTHORITY_INPUT
    sdd_modus: SHADOW → betinget ENFORCE
    sdd_endring: Utsteder-tillitsregister, attenuasjon og delegasjonslinje; asymmetrisk signatur
      før ENFORCE.
    oppnaelig_niva: WIRED_API_PATH
    oppnaelig_niva_tekst: WIRED_API_PATH i SHADOW; ENFORCE bare med akseptert asymmetrisk
      tillitsmodell.
    risiko:
      sannsynlighet: M
      konsekvens: H
      tekst: Aktivert med HMAC deler alle parter samme nøkkel og kan forfalske delegeringer.
    reversering:
      grad: Lett
      tekst: >-
        Av som standard. Avvist delegering gir aldri en alternativ tillatelse; direkte autoritet
        er bare gyldig hvis den valideres selvstendig.
    sikkerhet: Bare delmengde-delegering, replay- og audience-sjekk; ingen ENFORCE før asymmetrisk
      signatur.
    litteratur:
    - kilde: Objektkapabiliteter, macaroons
      referanse: PROV-06/PROV-10
      rolle: positioning_only
    - kilde: CaMeL
      referanse: arXiv 2503.18813
      rolle: positioning_only
    - kilde: RES-012 Oppgavebundet autoritet
      referanse: Yan, arXiv 2608.27443
      rolle: implemented_and_tested
    forutsetter:
    - CAP-023
    - CAP-018
- id: CAP-007
  register_at_source:
    name: Review queue with TTL-to-ABSTAIN and approval freshness re-gate
    status: WIRED_API_PATH
    code:
    - remora/governance/review_queue.py
    - servers/execution_api.py
    tests:
    - tests/test_delegated_execution_and_approval_policy.py
    - tests/test_review_path_audit_r3.py
    - tests/test_review_path_binding.py
    - tests/test_review_queue.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_API_PATH
    - LIMITED_ENFORCEMENT≥PERSISTED_ATOMIC
  assessment:
    navn: Gjennomgangskø
    klasse: 'Kjerne: menneske'
    formaal: Lar et menneske godkjenne eller avvise før en ikke-ACCEPT-beslutning kan utføres.
    gjor: >-
      Kø med TTL til ABSTAIN og ny ferskhetsport ved godkjenning: endret intensjon, aktør
      eller ToolSpec ugyldiggjør.
    naa: >-
      approve/reject og SDK finnes; list-endepunkt finnes ikke. SQLite er omstartsbevist,
      Postgres-grenen er ikke kontrakttestet. §98 (åpen).
    nodvendighet: Kritisk
    nodvendighet_begrunnelse: >-
      CONTROLLED_PILOT krever menneskelig godkjenning på hvert ikke-accept og WIRED_API_PATH;
      LIMITED_ENFORCEMENT krever PERSISTED_ATOMIC.
    sdd_hook: POLICY / REVIEW
    sdd_modus: ENFORCE
    sdd_endring: List-endepunkt, separat reviewer-credential, to-personsregel, Postgres-kontrakttest.
    oppnaelig_niva: PERSISTED_ATOMIC
    oppnaelig_niva_tekst: PERSISTED_ATOMIC med Postgres-kontrakttest; ENFORCED_PRODUCTION
      etter pilotdrift.
    risiko:
      sannsynlighet: M
      konsekvens: H
      tekst: >-
        Selvgodkjenning eller lekket grant ved avslått admission (§98). En godkjenning av
        en allerede endret handling.
    reversering:
      grad: Middels
      tekst: Kø-poster kan avvises og utløpe; godkjente og utførte handlinger kan ikke trekkes
        tilbake.
    sikkerhet: Fersk re-gate, reviewer ≠ initiator, grant holdes tilbake og brukes når admission
      nekter.
