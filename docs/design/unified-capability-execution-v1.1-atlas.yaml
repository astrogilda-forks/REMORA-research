    release_profile_requirements: []
  assessment:
    name: Cumulative limits
    class: 'Core: budget'
    purpose: >-
      Stops a series of actions that are each allowed on their own but together exceed a
      budget.
    does: >-
      Signed sum, count and change limits per principal or resource; reserve → begin → settle
      before dispatch; an idempotency key per tool.
    now: >-
      Opt-in; SQLite on one host or a shared Postgres database. At source_revision six pilot blockers; P0 items
      1 to 3 are closed in this PR: the reviewer's evidence is checked by a deployment-owned
      evidence module before anything is released (without a module everything is held),
      ToolDidNotExecute frees a reservation only from a source the signed policy names,
      REMORA_REQUIRE_IDEMPOTENCY requires an idempotency key per metered write tool, and
      controlled_pilot requires signed mandatory limits. P0 item 4 is closed as a repair
      protocol: the ledger records the resolution first and an idempotent sweep appends the
      chain record. P0 item 8: the ledger takes a Postgres DSN and serializes every
      transaction with one advisory lock; two executors on one database are tested in CI.
      Remaining: activation on a multi-host deployment.
    necessity: Critical
    necessity_rationale: For a payment-like pilot this is the main control.
    sdd_hook: PRE_DISPATCH / EXECUTION / EFFECT
    sdd_mode: ENFORCE, mandatory in the bounded write pilot
    sdd_change: >-
      Delivered: SDK list_unresolved and resolve_unknown, evidence checking, named
      non_execution sources, the key requirement, the profile binding, the ledger-first
      resolution record with its idempotent chain sweep, and the Postgres LimitLedger
      (P0 1 to 4 and 8). Remaining: a multi-host deployment that runs it.
    reachable_rung: ENFORCED_PRODUCTION
    reachable_rung_text: >-
      ENFORCED_PRODUCTION in one pilot after a shared ledger and the closed §97 items.
    risk:
      likelihood: H
      consequence: H
      text: >-
        Double charge, budget released for an action that actually happened, overrun across
        hosts.
    reversibility:
      grade: Hard
      text: >-
        The history is not deleted. A reservation can be released through a documented
        resolution once it is established that the effect did not happen; a configuration
        rollback never releases budget.
    security: >-
      Signed policy, idempotency key, reviewer ≠ payer, UNKNOWN holds the budget until
      resolved.
    literature:
    - source: Prior art for cumulative limits
      reference: >-
        provenance/verified-prior-art-cumulative-limits-2026-10-23.md: Schneider 2000, edit
        automata 2005, UCON_ABC 2004, escrow 1986, leases 1989, Simplex, shielding 2018
      role: PRIOR_ART_OVERLAP
    - source: NEGATIVE_RESULTS §97
      reference: three open items at source_revision, closed on one host in #1053
      role: record
    depends_on:
    - CAP-013
    - CAP-005
    - CAP-007
    - CAP-017
