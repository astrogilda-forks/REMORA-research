repair_order:
- step: 1
  work: >-
    Stop unconfirmed budget release. Cover both ToolDidNotExecute and a reviewer's
    executed=false.
  acceptance: Without checkable evidence the reservation stays held as unknown.
  capabilities:
  - CAP-031
- step: 2
  work: Require a stable operation key for every relevant write tool.
  acceptance: The same business operation submitted through new proposals does not run again.
  capabilities:
  - CAP-031
- step: 3
  work: Make signed limits and the required coverage mandatory in the write-pilot profile.
  acceptance: A missing key, signature or meter refuses startup or the call.
  capabilities:
  - CAP-031
  - CAP-017
- step: 4
  work: Make limits resolution and audit transactionally consistent.
  acceptance: >-
    A crash between the ledger change and the chain record leaves no permanent undocumented
    budget release.
  capabilities:
  - CAP-031
  - CAP-005
- step: 5
  work: Re-verify the §98 repair and atomic admission.
  acceptance: >-
    A refused review leaks no usable grant, also when invalidation or storage fails.
  capabilities:
  - CAP-007
  - CAP-003
- step: 6
  work: >-
    Finish flow binding, the flow race and the freshness contract (IFC-06 in progress; IFC-11
    and IFC-12 not started).
  acceptance: >-
    Controlled arguments match the actual tool input; changed authority or flow stops the
    action within the declared contract.
  capabilities:
  - CAP-030
  - CAP-020
- step: 7
  work: Verify the credential topology and the stop mechanism.
  acceptance: Agent and tool worker cannot bypass the executor; a verify-only process cannot sign.
  capabilities:
  - CAP-024
  - CAP-017
  - CAP-003
  - CAP-013
- step: 8
  work: Build the shared LimitLedger before multi-host activation.
  acceptance: Two executors share budget and operation keys without double spending.
  capabilities:
  - CAP-031
capabilities:
- id: CAP-001
  register_at_source:
    name: Decision engine (hard guards -> conditional gates -> trust routing)
    status: WIRED_API_PATH
    code:
    - remora/policy/decision_engine.py
    - servers/api.py
    tests:
    - tests/test_rem017_policy_mutations.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - SHADOW_PILOT≥WIRED_API_PATH
    - PRODUCTION≥EXTERNALLY_VERIFIED
  assessment:
    name: Decision engine
    class: 'Core: authority'
    purpose: 'Gives one deterministic decision per proposal: ACCEPT, VERIFY, ABSTAIN or ESCALATE.'
    does: >-
      Hard guards run first, then conditional gates, then trust routing. No model or monitor
      can override a hard guard.
    now: >-
      Wired through /v1/assess (decision only) and /v1/execution/* (the full state machine with
      enforcement). The decision trace with rule IDs is not exposed as its own API.
    necessity: Critical
    necessity_rationale: >-
      All authority starts here. SHADOW_PILOT requires WIRED_API_PATH, and PRODUCTION requires
      EXTERNALLY_VERIFIED.
    sdd_hook: POLICY
    sdd_mode: ENFORCE
    sdd_change: >-
      Decision trace and rule IDs through the proposed capability trace; decision_trace in the
      SDK's AssessmentResult.
    reachable_rung: ENFORCED_PRODUCTION
    reachable_rung_text: >-
      ENFORCED_PRODUCTION within one pilot configuration. EXTERNALLY_VERIFIED needs REM-021 and
      lies outside the SDD.
    risk:
      likelihood: L
      consequence: H
      text: >-
        A wrong rule gives a wrong ACCEPT for a whole tool class. Mutation tests (REM-017) and
        the invariant check (CAP-015) make this less likely.
    reversibility:
      grade: Medium
      text: >-
        The policy version is pinned and signed; rollback goes to the previous signed policy,
        not to a code change in operation.
    security: >-
      Deterministic guards dominate, the invariant check fails closed to ESCALATE, and mutation
      tests kill every guard that is removed.
    literature:
    - source: RES-005 Tool safety and agent guardrails
      reference: idea family, no single source
      role: implemented_and_tested
    - source: RES-023 Semantic authority for tool routing
      reference: internal design (SAP v5/v6)
      role: implemented_and_tested
    - source: SHELF-002 Sample, Predict, then Proceed
      reference: arXiv 2506.02918
      role: ADOPTED
    - source: AgentSpec
      reference: arXiv 2503.18666
      role: positioning_only
    depends_on:
    - CAP-004
- id: CAP-002
  register_at_source:
    name: OPA/Rego delegation with full input parity and monotone floors
    status: WIRED_REFERENCE_PATH
    code:
    - remora/policy/opa_adapter.py
    - scripts/opa_conformance.py
    tests:
    - tests/test_opa_parity.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements: []
  assessment:
    name: OPA/Rego delegation
    class: Policy interop
    purpose: Lets a customer express policy in OPA/Rego without weakening REMORA's own floor.
    does: >-
      Sends the full input to OPA with parity against the Python floor. The answer can only make
      the decision stricter (monotone floor).
    now: >-
      CI-gated conformance; not exposed through the REST API. No PolicyProvider registry exists;
      the nearest seam is DecisionProvider.
    necessity: Optional
    necessity_rationale: Useful for customers that already run OPA, but no pilot profile requires it.
    sdd_hook: POLICY
    sdd_mode: SHADOW → conditional ENFORCE
    sdd_change: Server-side plugin via DecisionProvider, signed and pinned bundle, parity attestation.
    reachable_rung: WIRED_API_PATH
    reachable_rung_text: >-
      WIRED_API_PATH in SHADOW; ENFORCE only after parity evidence on frozen and adversarial
      cases.
    risk:
      likelihood: M
      consequence: M
      text: >-
        A parity gap between Rego and Python gives a different decision. The monotone floor limits
        the error to over-strict decisions.
    reversibility:
      grade: Easy
      text: Turned off by removing the bundle; the Python floor stands alone as before.
    security: >-
      Rego can never lower the floor; a timeout or an error in OPA gives a refusal, not ACCEPT.
    literature:
    - source: The PDP/PEP pattern (XACML, OPA)
      reference: 'PROV-05: known pattern'
      role: positioning_only
    depends_on:
    - CAP-001
- id: CAP-003
  register_at_source:
    name: Signed PDP->PEP token (mandatory expiry, jti one-time consumption, audience, max
      age)
    status: WIRED_API_PATH
    code:
    - remora/enforcement/gate.py
    - remora/enforcement/token.py
    - servers/execution_api.py
    tests:
    - tests/test_enforcement_ledgers_postgres.py
    - tests/test_token_hardening.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_API_PATH
    - LIMITED_ENFORCEMENT≥ENFORCED_PRODUCTION
  assessment:
    name: Signed PDP→PEP token
    class: 'Core: authority'
    purpose: >-
      Carries a decision from the PDP to the enforcement point as a single-use, expiring,
      audience-bound authorization.
    does: Token with mandatory expiry, audience and maximum age; the jti is consumed once.
    now: >-
      Grant format v3 is Ed25519; a process holding only REMORA_PDP_VERIFY_KEYS_ED25519 can
      redeem grants but not issue them. HMAC (v1/v2) is the older migration mode and is refused
      once Ed25519 is configured, unless REMORA_PDP_ACCEPT_HMAC is explicitly enabled (1, true,
      yes or on). The register's caveat still describes HMAC and lags the code. The jti is
      stored durably (pep_consumed) only with REMORA_PG_DSN or REMORA_CHAIN_DB, otherwise in
      process. The register's caveat says no test starts a new interpreter; this review did not
      identify a relevant process-restart test either.
    necessity: Critical
    necessity_rationale: >-
      CONTROLLED_PILOT requires WIRED_API_PATH; LIMITED_ENFORCEMENT requires ENFORCED_PRODUCTION.
    sdd_hook: PRE_DISPATCH
    sdd_mode: ENFORCE
    sdd_change: >-
      Grant and jti state in the result, SDK types SingleUseGrant/GrantStatus; shared backend
      mandatory; no client minting.
    reachable_rung: ENFORCED_PRODUCTION
    reachable_rung_text: >-
      ENFORCED_PRODUCTION in the pilot, given a shared ledger and v3 with a verify-only process
      in the execution domain.
    risk:
      likelihood: M
      consequence: H
      text: >-
        Reusing a token gives double execution. With issuer and redeemer in one process holding
        the private key, the split is one domain only. NEGATIVE_RESULTS §98 showed that an
        unspent grant could be returned on the review path; repaired and re-verified on Postgres
        with ledger and storage faults (P0 item 5), but open until run independently.
    reversibility:
      grade: Hard
      text: Spent tokens must stay spent. A rollback never deletes pep_consumed rows.
    security: >-
      Ed25519 v3 with a verify-only redeemer, HMAC downgrade refused, single-use jti in a durable
      ledger, expiry, audience and maximum age; the grant is withheld when admission refuses (the
      §98 repair).
    literature:
    - source: Signed authorization tokens, XACML PDP/PEP
      reference: PROV-05
      role: positioning_only
    - source: Single-use nonces and replay ledgers
      reference: 'PROV-14: classic'
      role: positioning_only
    depends_on:
    - CAP-017
    - CAP-005
- id: CAP-004
  register_at_source:
    name: Tool-call payload binding (canonical hash, recomputed before execution)
    status: WIRED_API_PATH
    code:
    - remora/policy/observation.py
    - servers/execution_api.py
    tests:
    - tests/test_execution_api.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_API_PATH
    - LIMITED_ENFORCEMENT≥ENFORCED_PRODUCTION
  assessment:
    name: Payload binding
    class: 'Core: authority'
    purpose: Ensures the authorization applies to exactly one call with exactly these arguments.
    does: >-
      Canonical hash of the tool name and all arguments, recomputed just before execution.
      ExecutionLease binds 16 fields.
    now: >-
      /v1/execution/assess hashes the full arguments; the legacy /v1/assess keeps summary binding.
      The SDK's ToolCall lacks tenant, principal and digests.
    necessity: Critical
    necessity_rationale: >-
      CONTROLLED_PILOT requires WIRED_API_PATH; LIMITED_ENFORCEMENT requires ENFORCED_PRODUCTION.
    sdd_hook: PRE_DISPATCH
    sdd_mode: ENFORCE
    sdd_change: >-
      Lease-bound identity exposed in the attestation and the SDK; differential canonicalization
      tests Python/TypeScript.
    reachable_rung: ENFORCED_PRODUCTION
    reachable_rung_text: ENFORCED_PRODUCTION in the pilot.
    risk:
      likelihood: L
      consequence: H
      text: >-
        A canonicalization gap (Unicode, duplicate keys, numbers) between two parsers can let a
        swapped argument through.
    reversibility:
      grade: Hard
      text: >-
        Never to be turned off in a pilot; a change in canonicalization is a new contract version.
    security: Recomputation at dispatch, 16-field lease, differential tests across languages.
    literature:
    - source: Exact call binding
      reference: PROV-03; AEGIS arXiv 2603.12621 (crosswalk)
      role: positioning_only
    - source: Canonical JSON
      reference: RFC 8785; PROV-13
      role: positioning_only
    - source: Proof-Carrying Agent Actions
      reference: arXiv 2606.04104
      role: positioning_only
    depends_on: []
- id: CAP-005
  register_at_source:
    name: Audit chain (hash-chained decision history)
    status: PERSISTED_ATOMIC
    code:
    - remora/governance/tenant_chain.py
    - servers/execution_api.py
    tests:
    - tests/test_execution_api.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - SHADOW_PILOT≥PERSISTED_ATOMIC
    - PRODUCTION≥ENFORCED_PRODUCTION
  assessment:
    name: Audit chain
    class: Evidence and audit
    purpose: Gives a tamper-evident, hash-chained decision history per tenant.
    does: >-
      Every event is chained to the previous one; verification exists as /v1/audit/chain/verify
      and /v1/execution/audit/verify.
    now: >-
      PERSISTED_ATOMIC with REMORA_CHAIN_DB (SQLite) or REMORA_PG_DSN (Postgres FOR UPDATE); the
      default is in process. Activation in a deployment is not claimed.
    necessity: Critical
    necessity_rationale: >-
      SHADOW_PILOT requires PERSISTED_ATOMIC; PRODUCTION requires ENFORCED_PRODUCTION and REM-025.
    sdd_hook: AUDIT
    sdd_mode: ENFORCE + EVIDENCE_ONLY
    sdd_change: >-
      Tenant and checkpoint linkage; tests with two writers, a crash during append, forks and
      ordering.
    reachable_rung: ENFORCED_PRODUCTION
    reachable_rung_text: >-
      ENFORCED_PRODUCTION with Postgres in the pilot; external anchoring (REM-025) is separate
      work.
    risk:
      likelihood: M
      consequence: M
      text: >-
        The chain does not prove completeness: an operator can suppress an event before append.
        Without a DSN the history is lost on restart.
    reversibility:
      grade: Hard
      text: >-
        The data is append-only and is not to be reversed. The configuration can change, but old
        records are kept.
    security: FOR UPDATE in Postgres, signed records (CAP-017), verification endpoints.
    literature:
    - source: Tamper-evident logging
      reference: Crosby & Wallach 2009; RFC 6962 (PROV-01)
      role: positioning_only
    - source: 'SHELF-026 AIREP: per-decision evidence'
      reference: arXiv 2608.21363
      role: PARTIAL
    - source: Auditable Agents
      reference: arXiv 2604.05485 (not in the repository)
      role: absent
    depends_on:
    - CAP-017
- id: CAP-006
  register_at_source:
    name: A2A delegation envelope (principal-bound keys, attenuation, replay, payload binding)
    status: WIRED_REFERENCE_PATH
    code:
    - remora/governance/a2a_envelope.py
    - scripts/demo_industrial_maintenance.py
    tests:
    - tests/test_a2a_envelope.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements: []
  assessment:
    name: A2A delegation
    class: 'Interop: authority'
    purpose: Lets one agent delegate a narrowed part of its authority to another.
    does: Envelope with principal-bound keys, attenuation, replay protection and payload binding.
    now: Symmetric HMAC reference; production needs JWS/COSE and trust anchors.
    necessity: Optional
    necessity_rationale: >-
      The first pilot does not need it; ADR-UE-06 proposes SHADOW until an asymmetric model is
      accepted.
    sdd_hook: AUTHORITY_INPUT
    sdd_mode: SHADOW → conditional ENFORCE
    sdd_change: >-
      Issuer trust register, attenuation and delegation lineage; asymmetric signature before
      ENFORCE.
    reachable_rung: WIRED_API_PATH
    reachable_rung_text: >-
      WIRED_API_PATH in SHADOW; ENFORCE only with an accepted asymmetric trust model.
    risk:
      likelihood: M
      consequence: H
      text: Enabled with HMAC, every party shares the same key and can forge delegations.
    reversibility:
      grade: Easy
      text: >-
        Off by default. A refused delegation never yields an alternative permission; direct
        authority is valid only if it validates on its own.
    security: >-
      Subset-only delegation, replay and audience checks; no ENFORCE before an asymmetric
      signature.
    literature:
    - source: Object capabilities, macaroons
      reference: PROV-06/PROV-10
      role: positioning_only
    - source: CaMeL
      reference: arXiv 2503.18813
      role: positioning_only
    - source: RES-012 Task-bound authority
      reference: Yan, arXiv 2608.27443
      role: implemented_and_tested
    depends_on:
    - CAP-023
    - CAP-018
- id: CAP-007
  register_at_source:
    name: Review queue with TTL-to-ABSTAIN and approval freshness re-gate
    status: WIRED_API_PATH
    code:
    - remora/governance/review_queue.py
    - servers/execution_api.py
    tests:
    - tests/test_delegated_execution_and_approval_policy.py
    - tests/test_review_path_audit_r3.py
    - tests/test_review_path_binding.py
    - tests/test_review_queue.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_API_PATH
    - LIMITED_ENFORCEMENT≥PERSISTED_ATOMIC
  assessment:
    name: Review queue
    class: 'Core: human'
    purpose: Lets a human approve or reject before a non-ACCEPT decision can execute.
    does: >-
      Queue with TTL to ABSTAIN and a fresh re-gate at approval: a changed intent, actor or
      ToolSpec invalidates.
    now: >-
      approve/reject and the SDK exist; no list endpoint exists. SQLite is restart-proven; the
      review path's admission runs on Postgres in CI since P0 item 5 (§98 tests), the queue's
      other Postgres branches are not contract-tested. §98 (open until run independently).
    necessity: Critical
    necessity_rationale: >-
      CONTROLLED_PILOT requires human approval on every non-accept and WIRED_API_PATH;
      LIMITED_ENFORCEMENT requires PERSISTED_ATOMIC.
    sdd_hook: POLICY / REVIEW
    sdd_mode: ENFORCE
    sdd_change: >-
      List endpoint, separate reviewer credential, two-person rule, Postgres contract test.
    reachable_rung: PERSISTED_ATOMIC
    reachable_rung_text: >-
      PERSISTED_ATOMIC with a Postgres contract test; ENFORCED_PRODUCTION after pilot operation.
    risk:
      likelihood: M
      consequence: H
      text: >-
        Self-approval, or a grant leaked on a refused admission (§98). An approval of an action
        that has already changed.
    reversibility:
      grade: Medium
      text: >-
        Queue items can be rejected and expire; approved and executed actions cannot be taken
        back.
    security: >-
      Fresh re-gate, reviewer ≠ initiator, the grant is withheld and spent when admission
      refuses.
    literature:
    - source: 'SHELF-027 AID-Guard: revalidation at commit'
      reference: arXiv 2608.21159
      role: UNEVALUATED
    - source: TOCTOU and re-authorization
      reference: PROV-04
      role: positioning_only
    depends_on:
    - CAP-009
    - CAP-003
- id: CAP-008
  register_at_source:
    name: Degradation ladder G0-G4 with tamper-evident transition log
    status: WIRED_REFERENCE_PATH
    code:
    - remora/governance/degradation.py
    - scripts/remora_hook.py
    tests:
    - tests/test_degradation_ladder.py
    - tests/test_hook_production_profile.py
    artifacts: []
    docs: []
    negative_results: []
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_REFERENCE_PATH
  assessment:
    name: Degradation ladder G0–G4
    class: Operations and safety
    purpose: Reduces privileges step by step when dependencies fail.
    does: >-
      G0–G4 with a tamper-evident transition log; G4 allows only positively known read and
      non-actuating types.
    now: >-
      The hook enforces G4 in the production profile; no long-lived recorder process is
      deployed.
    necessity: Necessary
    necessity_rationale: CONTROLLED_PILOT requires WIRED_REFERENCE_PATH.
    sdd_hook: OPS / POLICY
    sdd_mode: SHADOW → limited ENFORCE
    sdd_change: >-
      Degradation mode and signed transition reasons on the readiness API; central health.
    reachable_rung: WIRED_API_PATH
    reachable_rung_text: WIRED_API_PATH with readiness integration.
    risk:
      likelihood: L
      consequence: M
      text: >-
        An error in recovery can give silent re-authorization when a dependency comes back.
    reversibility:
      grade: Easy
      text: Modes are configuration; raising one needs an explicit decision, never automation.
    security: Default-deny allowlist (_G4_ALLOWED_TYPES), no automatic raise after recovery.
    literature:
    - source: Simplex architecture and fail-safe design
      reference: prior art for the CAP-031 note
      role: positioning_only
    depends_on:
    - CAP-016
- id: CAP-009
  register_at_source:
    name: RBAC (nine-role capability matrix, credential-bound audit identity)
    status: WIRED_API_PATH
    code:
    - servers/api.py
    tests:
    - tests/test_rbac_isolation.py
    - tests/test_rbac_role_contract.py
    artifacts: []
    docs: []
    negative_results:
    - 8
    release_profile_requirements:
    - CONTROLLED_PILOT≥WIRED_API_PATH
  assessment:
    name: RBAC and audit identity
    class: 'Core: identity'
    purpose: Decides who may do what, and ties every audit record to a credential.
    does: Nine-role capability matrix; tenant isolation; credential-bound identity.
    now: Symmetric bearer tokens; OIDC/MFA are roadmap. REM-022 is DONE, REM-023 IN_PROGRESS.
    necessity: Critical
    necessity_rationale: CONTROLLED_PILOT requires WIRED_API_PATH and REM-023 finished.
    sdd_hook: ADMISSION / REVIEW
    sdd_mode: ENFORCE
    sdd_change: >-
      OIDC workload identity, MFA for high-risk approval, a token provider in the SDK.
    reachable_rung: ENFORCED_PRODUCTION
    reachable_rung_text: ENFORCED_PRODUCTION after REM-023 and a verified IdP integration.
    risk:
      likelihood: M
      consequence: H
      text: >-
        Role confusion, tenant leakage or a compromised bearer token gives unauthorized approval.
    reversibility:
      grade: Medium
      text: Roles can be revoked (revoke-principal); executed actions stand.
    security: Cross-tenant gives 404, one's own operation cannot be approved, isolation tests.
    literature:
    - source: RES-009 Enterprise governance
      reference: idea family
      role: reference_design
    - source: Separation of duties
      reference: classic
      role: positioning_only
    depends_on: []
- id: CAP-010
  register_at_source:
    name: Shared-engine concurrency safety (request-local cancellation, locked correlation
      reads)
